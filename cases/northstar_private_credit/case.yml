id: northstar_private_credit
title: Northstar Direct Lending Fund III
subtitle: The Meridian Cloud Systems Amendment Decision
presentation_role: Investment Committee member
case_date: 2026-10-30
fictional: true
narrative: >
  Northstar Direct Lending Fund III holds a senior secured first-lien loan to
  Meridian Cloud Systems, a fictional middle-market provider of workflow and
  compliance software. Meridian is current on its debt, but slower customer
  renewals and implementation delays have weakened cash generation. Management
  requests an amendment that would temporarily reduce cash interest, permit a
  portion of interest to be paid in kind, and reset the leverage covenant.
mandate: >
  Decide whether Northstar should approve the amendment, approve it with stronger
  lender protections, require an equity cure and partial paydown, or transfer the
  exposure to special situations.
decision_prompt: What should Northstar do with the Meridian exposure?
decision_choices:
  - Approve the amendment
  - Approve with stronger protections
  - Require equity cure and partial paydown
  - Transfer to special situations
risk_domains:
  - Credit risk
  - Liquidity risk
  - Valuation risk
  - Model risk
  - Portfolio concentration
baseline:
  commitment_mm: 85.0
  outstanding_mm: 80.0
  cash_rate_pct: 10.75
  pik_rate_pct: 0.0
  enterprise_value_mm: 420.0
