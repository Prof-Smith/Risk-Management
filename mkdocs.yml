site_name: Risk Management
site_description: Applied Risk Management — Concepts, Models, and Cases
site_author: Zachary Smith

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  
extra_css:
  - styles.css
  
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - search.highlight
    - content.code.copy
    - toc.integrate

  palette:
    - scheme: default
      primary: blue grey
      accent: teal
    - scheme: slate
      primary: blue grey
      accent: teal

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - mkdocs-jupyter:
      execute: false

extra_css:
  - styles.css

nav:
  - Home: index.md

  - Foundations:
      - Overview: foundations/index.md

  - Market Risk:
      - Overview: market_risk/index.md
      - Value at Risk (VaR): market_risk/var.md

  - Case Studies:
      - Overview: cases/index.md

      - LTCM (1998):
          - Executive Summary: cases/ltcm_summary.md
          - Overview: cases/ltcm.md
          - Assignment: cases/ltcm_assignment.md
          - Lab: cases/ltcm_notebook.ipynb

      - Lehman (2008):
          - Executive Summary: cases/lehman_summary.md
          - Overview: cases/lehman.md
          - Assignment: cases/lehman_assignment.md
          - Lab: cases/lehman_notebook.ipynb

      - London Whale (2012):
          - Executive Summary: cases/london_whale_summary.md
          - Overview: cases/london_whale.md
          - Assignment: cases/london_whale_assignment.md
          - Lab: cases/london_whale_notebook.ipynb
