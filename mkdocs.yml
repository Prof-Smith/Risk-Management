site_name: Risk Management
site_description: Applied Risk Management — Concepts, Models, and Cases
site_author: Zachary Smith

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - search.highlight
    - content.code.copy
    - toc.integrate

  palette:
    - scheme: default
      primary: blue grey
      accent: teal
    - scheme: slate
      primary: blue grey
      accent: teal
  font:
      text: Inter
      code: JetBrains Mono

plugins:
  - search
  - mkdocs-jupyter:
      execute: false

nav:
  - Home: index.md

  - Foundations:
      - Overview: foundations/index.md

  - Market Risk:
      - Overview: market_risk/index.md
      - Value at Risk (VaR): market_risk/var.md

  - Case Studies:
      - Overview: cases/index.md

      - LTCM (1998):
          - Overview: cases/ltcm.md
          - Assignment: cases/ltcm_assignment.md
          - Lab: cases/ltcm_notebook.ipynb

      - Lehman (2008):
          - Overview: cases/lehman.md
          - Assignment: cases/lehman_assignment.md
          - Lab: cases/lehman_notebook.ipynb
      
      - London Whale (2012):
          - Overview: cases/london_whale.md
          - Assignment: cases/london_whale_assignment.md
          - Lab: cases/london_whale_notebook.ipynb
