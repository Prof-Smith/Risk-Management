site_name: Risk Management
site_description: Applied Risk Management — Concepts, Models, and Cases
site_author: Zachary Smith

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocs-jupyter:
      execute: false

nav:
  - Home: index.md

  - Foundations:
      - Overview: foundations/index.md

  - Market Risk:
      - Overview: market_risk/index.md
      - Value at Risk (VaR): market_risk/var.md

  - Case Studies:
      - Overview: cases/index.md
      - LTCM (Case): cases/ltcm.md
      - LTCM (Assignment): cases/ltcm_assignment.md
      - LTCM (Notebook): cases/ltcm_notebook.ipynb
