site_name: Risk Management
site_description: Applied Risk Management — Concepts, Models, and Cases
site_author: Zachary Smith
  
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - search.highlight
    - content.code.copy
    - toc.integrate

  palette:
    - scheme: default
      primary: blue grey
      accent: teal
    - scheme: slate
      primary: blue grey
      accent: teal

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - mkdocs-jupyter:
      execute: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - styles.css


nav:
  - Home: index.md

  - Enterprise Risk Management (Capstone):
      - Overview: cases/erm.md
      - Executive Summary: cases/erm_summary.md
      - Assignment: cases/erm_assignment.md
      - Lab: cases/erm_notebook.ipynb

  - Case Studies:
      - Overview: cases/index.md

      - LTCM:
          - Executive Summary: cases/ltcm_summary.md
          - Overview: cases/ltcm.md
          - Assignment: cases/ltcm_assignment.md
          - Lab: cases/ltcm_notebook.ipynb

      - Lehman (2008):
          - Executive Summary: cases/lehman_summary.md
          - Overview: cases/lehman.md
          - Assignment: cases/lehman_assignment.md
          - Lab: cases/lehman_notebook.ipynb

      - London Whale:
          - Executive Summary: cases/london_whale_summary.md
          - Overview: cases/london_whale.md
          - Assignment: cases/london_whale_assignment.md
          - Lab: cases/london_whale_notebook.ipynb

      - Global Financial Crisis (2008):
          - Executive Summary: cases/gfc_summary.md
          - Overview: cases/gfc.md
          - Assignment: cases/gfc_assignment.md
          - Lab: cases/gfc_notebook.ipynb

      - Sunrise National Bank (SNB):
          - Executive Summary: cases/snb_summary.md
          - Overview: cases/snb.md
          - Assignment: cases/snb_assignment.md
          - Lab: cases/snb_notebook.ipynb

      - Atlas Bank International (ABI):
          - Executive Summary: cases/abi_summary.md
          - Overview: cases/abi.md
          - Assignment: cases/abi_assignment.md
          - Lab: cases/abi_notebook.ipynb
